name: Lint & deploy to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TURBO_API: https://turbo.swyrin.me
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: swyrin
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sanity-check:
    runs-on: "ubuntu-latest"
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/setup@v2
        with:
          version: "11.22.0"
          runtime: node@24

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Prepare Rust Worker toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --locked --version 0.8.5

      - run: pnpm add turbo wrangler --global

      - run: turbo run format

      - run: turbo run lint

      - run: turbo run test

      - run: turbo run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}

